<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Original illustration drawn by hand for this demo. A single invented creature in flight.
       Not a sigil, crest, emblem or logo: no heraldic frame, no shield, no repeated heads,
       no real place, and no reference to any published artwork. -->
  <defs>
    <linearGradient id="fireE" x1="0" y1="0" x2="1" y2="0.75">
      <stop offset="0"    stop-color="#D4832F" stop-opacity="0.92"/>
      <stop offset="0.40" stop-color="#E0A765" stop-opacity="0.50"/>
      <stop offset="1"    stop-color="#E8C08F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#F2F7FA"/>

  <!-- ── fortification across the base ───────────────────────────────── -->
  <path d="M0 412 L0 348
           L28 348 L28 330 L62 330 L62 348   L96 348 L96 330 L130 330 L130 348
           L164 348 L164 330 L198 330 L198 348   L232 348 L232 330 L266 330 L266 348
           L300 348 L300 330 L334 330 L334 348   L368 348 L368 330 L402 330 L402 348
           L436 348 L436 330 L470 330 L470 348   L504 348 L504 330 L538 330 L538 348
           L572 348 L572 330 L606 330 L606 348   L640 348 L640 330 L674 330 L674 348
           L708 348 L708 330 L742 330 L742 348   L800 348 L800 412 Z" fill="#AFC1CC"/>
  <path d="M128 412 L128 292 L146 278 L192 278 L210 292 L210 412 Z" fill="#8FA5B4"/>
  <path d="M144 292 L144 274 L160 274 L160 292 M178 292 L178 274 L194 274 L194 292" fill="#8FA5B4"/>
  <path d="M668 412 L668 254 L688 238 L742 238 L762 254 L762 412 Z" fill="#7B93A3"/>
  <path d="M686 254 L686 234 L704 234 L704 254 M726 254 L726 234 L744 234 L744 254" fill="#7B93A3"/>

  <!-- ── far wing: behind everything, lighter ────────────────────────── -->
  <path d="M416 198 C 368 146, 316 100, 268 66
           L 230 140 Q 288 150, 300 196 Q 356 198, 416 198 Z" fill="#8299A9"/>
  <g stroke="#73899A" stroke-width="2" fill="none" opacity="0.6">
    <path d="M268 66 L230 140"/><path d="M268 66 L300 196"/>
  </g>

  <!-- ── fire: from the jaws, widening onto the right tower ──────────── -->
  <path d="M608 152 L794 260 L748 326 L596 176 Z" fill="url(#fireE)"/>

  <!-- ── tail: curving, tapering, spined ─────────────────────────────── -->
  <path d="M342 252 C 302 270, 252 288, 202 302
           C 170 312, 138 320, 112 326 L 108 312
           C 134 306, 166 296, 198 286 C 250 270, 302 248, 338 232 Z" fill="#44596A"/>
  <g fill="#44596A">
    <path d="M292 258 L288 240 L306 250 Z"/>
    <path d="M232 280 L230 262 L246 273 Z"/>
    <path d="M176 298 L176 282 L190 292 Z"/>
    <path d="M112 326 L84 306 L104 322 L80 334 L116 334 Z"/>
  </g>

  <!-- ── body: tapered, deeper at the chest ──────────────────────────── -->
  <path d="M336 246 C 344 212, 384 192, 422 198
           C 456 204, 472 228, 464 252 C 454 280, 406 290, 372 280
           C 348 272, 332 262, 336 246 Z" fill="#44596A"/>
  <!-- spine ridge -->
  <g fill="#3A4E5E">
    <path d="M356 216 L352 200 L370 210 Z"/>
    <path d="M388 203 L386 186 L403 197 Z"/>
    <path d="M420 200 L420 184 L435 196 Z"/>
  </g>

  <!-- ── tucked legs ─────────────────────────────────────────────────── -->
  <path d="M398 278 C 410 292, 408 304, 394 312 L 378 302
           C 390 296, 392 288, 386 276 Z" fill="#3A4E5E"/>
  <path d="M394 312 L370 318 L392 320 L374 326 L400 324 Z" fill="#3A4E5E"/>
  <path d="M432 268 C 442 280, 440 290, 428 296 L 416 288
           C 426 284, 428 278, 424 268 Z" fill="#334656"/>

  <!-- ── neck: thick at the chest, tapering ──────────────────────────── -->
  <path d="M452 212 C 492 204, 522 188, 540 162 L 558 178
           C 536 210, 498 232, 458 242 Z" fill="#44596A"/>

  <!-- ── head ────────────────────────────────────────────────────────── -->
  <path d="M536 158 L566 136 L612 150 L570 168 Z" fill="#44596A"/>
  <path d="M556 178 L604 164 L570 188 Z" fill="#44596A"/>
  <path d="M550 144 L536 118 L566 134 Z" fill="#44596A"/>
  <path d="M542 150 L524 140 L544 142 Z" fill="#3A4E5E"/>
  <circle cx="566" cy="154" r="3.4" fill="#F2F7FA"/>

  <!-- ── near wing: three clear lobes, struts radiating from the wrist ─ -->
  <path d="M404 206 C 344 146, 272 100, 200 72
           L 156 150 Q 218 168, 228 214
           Q 288 232, 312 248 Q 358 230, 404 208 Z" fill="#54697A"/>
  <g stroke="#3A4E5E" stroke-width="2.3" fill="none" opacity="0.55">
    <path d="M200 72 L156 150"/>
    <path d="M200 72 L228 214"/>
    <path d="M200 72 L312 248"/>
  </g>
  <path d="M200 72 L186 52 L210 64 Z" fill="#54697A"/>
</svg>
